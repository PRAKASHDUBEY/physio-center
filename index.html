  const languageButtons = document.querySelectorAll("[data-language]");
  function setLanguage(language, remember = true) {
    document.documentElement.lang = language;
    document.querySelectorAll("[data-i18n]").forEach(element => {
      element.textContent = translations[language][element.dataset.i18n];
    });
    document.querySelectorAll("[data-i18n-alt]").forEach(element => {
      element.alt = translations[language][element.dataset.i18nAlt];
    });
    languageButtons.forEach(button => button.setAttribute("aria-pressed", button.dataset.language === language));
    document.title = language === "hi" ? "रीता फिजियो सेंटर | बक्सर में फिजियोथेरेपी और पुनर्वास" : "Rita Physio Centre | Physiotherapy & Rehabilitation in Buxar";

    if (remember) localStorage.setItem("rita-physio-language", language);
  }
